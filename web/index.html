<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>bb — ASCII art demo (WebAssembly)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body {
    height: 100%;
    margin: 0;
    background: #000;
    color: #ccc;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1rem;
  }
  pre#screen {
    margin: 0;
    line-height: 1.15;
    font-size: clamp(6px, 1.1vw, 14px);
    white-space: pre;
  }
  #status { color: #666; }
  footer {
    color: #444;
    font-size: 0.8rem;
  }
  footer a { color: #666; }
</style>
</head>
<body>
  <pre id="screen"></pre>
  <div id="status">Loading bb.wasm&hellip;</div>
  <footer><a href="https://github.com/chrisns/docker-bb">chrisns/docker-bb</a> — bb compiled to wasm32-wasi with zig cc, run client-side</footer>
  <script type="module" src="app.js"></script>
</body>
</html>
